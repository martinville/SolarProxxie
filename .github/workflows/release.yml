name: Publish firmware release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.2
    steps:
      - uses: actions/checkout@v4
      - name: Verify version and build
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "v$(tr -d '\r\n' < VERSION)"
          . /opt/esp/idf/export.sh
          idf.py set-target esp32
          idf.py build
          python tools/prepare_pages.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-firmware
          path: |
            site/firmware/SolarProxxie.bin
            site/firmware/SolarProxxie-full.bin
            site/firmware/release.json

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-firmware
          path: release
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/SolarProxxie.bin
          release/SolarProxxie-full.bin
          release/release.json
          --repo "$GITHUB_REPOSITORY"
          --title "SolarProxxie $GITHUB_REF_NAME"
          --generate-notes
